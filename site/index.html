<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Model Library: Energy and IoT</title>
<style>
  :root { --bg:#fff; --fg:#1a1a24; --muted:#6b6b7a; --line:#e4e2ee; --accent:#6d3fd0; --card:#f7f5fc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14121b; --fg:#ecebf3; --muted:#9a98ab; --line:#2a2638; --card:#1d1a29; --accent:#a98bff; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 "DM Sans",system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:880px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  input[type=search] { width:100%; padding:12px 14px; font:inherit; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 20px; }
  select { padding:8px; font:inherit; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  .card { border:1px solid var(--line); background:var(--card); border-radius:12px; padding:16px; margin-bottom:12px; cursor:pointer; }
  .card h2 { font-size:1.1rem; margin:0 0 6px; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .tag { font:12px "DM Mono",monospace; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .tag.ev-documented { color:#1f7a4d; border-color:#1f7a4d; }
  .tag.ev-inferred { color:#a06b00; border-color:#a06b00; }
  .tag.ev-assumed, .tag.ev-speculative { color:#b33a3a; border-color:#b33a3a; }
  .detail { display:none; margin-top:12px; border-top:1px solid var(--line); padding-top:12px; }
  .card.open .detail { display:block; }
  h3 { font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 4px; }
  ul { margin:0; padding-left:20px; }
  .blocks { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
  .block { border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .block b { font-size:.8rem; color:var(--muted); display:block; }
  .none { color:var(--muted); }
  footer { color:var(--muted); font-size:.85rem; margin-top:30px; }
</style>
</head>
<body>
<main>
  <h1>Business Model Library</h1>
  <p class="sub">Energy and IoT. Every entry shows what it needs, how sure we are, and where it came from.</p>
  <input type="search" id="q" placeholder="Search models, building blocks, risks, companies">
  <div class="filters">
    <select id="archetype"><option value="">All archetypes</option></select>
    <select id="outcome"><option value="">All outcomes</option></select>
    <select id="evidence"><option value="">All evidence levels</option></select>
  </div>
  <div id="list"></div>
  <footer>Draft. Evidence levels: documented, inferred, assumed, speculative. Outcome is shown separately from evidence.</footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const label = (s) => esc(String(s).replace(/_/g, " "));
let entries = [];

function fillSelect(id, values) {
  [...new Set(values)].sort().forEach((v) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = v.replace(/_/g, " ");
    $(id).appendChild(o);
  });
}

function list(items) {
  return items && items.length ? "<ul>" + items.map((i) => `<li>${esc(i)}</li>`).join("") + "</ul>" : '<span class="none">none</span>';
}

function render() {
  const q = $("q").value.toLowerCase();
  const a = $("archetype").value, o = $("outcome").value, e = $("evidence").value;
  const shown = entries.filter((x) =>
    (!a || x.archetype === a) && (!o || x.outcome === o) && (!e || x.evidence === e) &&
    (!q || JSON.stringify(x).toLowerCase().includes(q)));
  $("list").innerHTML = shown.length ? shown.map(card).join("") : '<p class="none">Not covered yet.</p>';
  document.querySelectorAll(".card").forEach((c) => c.addEventListener("click", () => c.classList.toggle("open")));
}

function card(x) {
  const blocks = Object.entries(x.building_blocks)
    .map(([k, v]) => `<div class="block"><b>${label(k)}</b>${list(v)}</div>`).join("");
  const risks = x.risks_failure_causes.map((r) =>
    `<li>${esc(r.text)} <span class="tag ev-${esc(r.evidence)}">${esc(r.evidence)}</span></li>`).join("");
  const cases = (x.cases || []).map((c) =>
    `<li><b>${esc(c.company)}</b> (${esc(c.market)}, ${esc(c.period)}): ${esc(c.note)} <span class="tag ev-${esc(c.evidence)}">${esc(c.evidence)}</span></li>`).join("");
  const sources = x.sources.map((s) =>
    `<li>[${esc(s.id)}] ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)} <span class="tag">${label(s.kind)}</span></li>`).join("");
  return `<div class="card">
    <h2>${esc(x.name)}</h2>
    <div class="tags">
      <span class="tag">${label(x.archetype)}</span>
      <span class="tag">outcome: ${label(x.outcome)}</span>
      <span class="tag ev-${esc(x.evidence)}">${esc(x.evidence)}</span>
      <span class="tag">verified ${esc(x.last_verified)}</span>
    </div>
    <div>${esc(x.summary)}</div>
    <div class="detail">
      <h3>How it makes money</h3><div>${esc(x.how_it_makes_money)}</div>
      <h3>What it involves</h3><div class="blocks">${blocks}</div>
      <h3>What must be true</h3>${list(x.what_must_be_true)}
      <h3>Risks and failure causes</h3><ul>${risks}</ul>
      ${cases ? `<h3>Cases</h3><ul>${cases}</ul>` : ""}
      <h3>Sources</h3><ul>${sources}</ul>
    </div>
  </div>`;
}

fetch("entries.json").then((r) => r.json()).then((data) => {
  entries = data;
  fillSelect("archetype", data.map((x) => x.archetype));
  fillSelect("outcome", data.map((x) => x.outcome));
  fillSelect("evidence", data.map((x) => x.evidence));
  ["q", "archetype", "outcome", "evidence"].forEach((id) => $(id).addEventListener("input", render));
  render();
});
</script>
</body>
</html>
